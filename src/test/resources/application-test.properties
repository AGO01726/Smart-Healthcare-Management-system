# Used by automated tests only: in-memory H2 database in MySQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:hmstest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
hms.seed.enabled=false
hms.registration.enabled=true
hms.appointment.slot-minutes=30
spring.thymeleaf.cache=false
