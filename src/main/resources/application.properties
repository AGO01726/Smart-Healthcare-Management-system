spring.application.name=smart-healthcare
server.port=${SERVER_PORT:8080}

# ---------- Database (MySQL) ----------
# Override with environment variables DB_URL, DB_USERNAME, DB_PASSWORD (see README).
# createDatabaseIfNotExist=true lets MySQL create the schema on first start.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_healthcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# "update" creates/updates tables automatically. Use DDL_AUTO=none if you ran database/schema.sql yourself.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# ---------- Web / Thymeleaf ----------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- Safe error handling (never leak stack traces) ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------- Application settings ----------
# Demo accounts + FICTIONAL sample data are created ONLY when the database is empty.
# Set HMS_SEED_ENABLED=false for any real deployment.
hms.seed.enabled=${HMS_SEED_ENABLED:true}
# Password for the locally seeded demo accounts. Override with HMS_DEMO_PASSWORD.
hms.seed.demo-password=${HMS_DEMO_PASSWORD:Demo@12345}
# Allow patients to self-register at /register
hms.registration.enabled=${HMS_REGISTRATION_ENABLED:true}
# Length of one appointment slot in minutes
hms.appointment.slot-minutes=30
