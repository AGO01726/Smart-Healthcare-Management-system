<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-card text-center">
        <div class="logo"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <h1 class="display-5 fw-bold mb-1" th:text="${status}">500</h1>
        <h2 class="h5" th:text="${error}">Error</h2>
        <p class="text-muted" th:text="${message} ?: 'Something went wrong.'">Message</p>
        <a class="btn btn-primary" th:href="@{/dashboard}"><i class="bi bi-house me-1"></i> Back to dashboard</a>
    </div>
</div>
</body>
</html>
