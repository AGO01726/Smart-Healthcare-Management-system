<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Doctor profile')}"></head>
<body>
<div class="app-shell">
<aside th:replace="~{fragments/layout :: sidebar('doctors')}"></aside>
<div class="app-main">
<header th:replace="~{fragments/layout :: topbar('Doctor profile')}"></header>
<main class="content">
<div th:replace="~{fragments/layout :: flash}"></div>
<div class="page-title-row"><h2 th:text="${doctor.fullName}">Dr</h2>
  <div class="d-flex flex-wrap gap-2">
    <a class="btn btn-primary" th:if="${doctor.active}" sec:authorize="hasAnyRole('ADMIN','RECEPTIONIST','PATIENT')" th:href="@{/appointments/new(doctorId=${doctor.id})}"><i class="bi bi-calendar-plus me-1"></i> Book appointment</a>
    <a class="btn btn-outline-secondary" sec:authorize="hasRole('ADMIN')" th:href="@{/doctors/{id}/edit(id=${doctor.id})}"><i class="bi bi-pencil me-1"></i> Edit</a>
    <form sec:authorize="hasRole('ADMIN')" th:action="@{/doctors/{id}/delete(id=${doctor.id})}" method="post" data-confirm="Delete this doctor and their login?">
      <button class="btn btn-outline-danger" type="submit"><i class="bi bi-trash me-1"></i> Delete</button></form>
  </div></div>
<div class="card"><div class="card-body"><dl class="detail-list row mb-0">
  <div class="col-md-4"><dt>Department</dt><dd th:text="${doctor.department.name}">x</dd></div>
  <div class="col-md-4"><dt>Specialization</dt><dd th:text="${doctor.specialization}">x</dd></div>
  <div class="col-md-4"><dt>Qualification</dt><dd th:text="${doctor.qualification} ?: '-'">x</dd></div>
  <div class="col-md-4"><dt>Experience</dt><dd th:text="${doctor.experienceYears + ' years'}">x</dd></div>
  <div class="col-md-4"><dt>Consultation fee</dt><dd th:text="${'INR ' + #numbers.formatDecimal(doctor.consultationFee, 1, 2)}">x</dd></div>
  <div class="col-md-4"><dt>Phone</dt><dd th:text="${doctor.phone}">x</dd></div>
  <div class="col-md-4"><dt>Available days</dt><dd th:text="${doctor.availableDaysLabel}">x</dd></div>
  <div class="col-md-4"><dt>Hours</dt><dd th:text="${#temporals.format(doctor.availableFrom,'HH:mm') + ' - ' + #temporals.format(doctor.availableTo,'HH:mm')}">x</dd></div>
  <div class="col-md-4"><dt>Status</dt><dd><span class="badge" th:classappend="${doctor.active} ? 'bg-success' : 'bg-secondary'" th:text="${doctor.active} ? 'Active' : 'Inactive'">x</span></dd></div>
</dl></div></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
